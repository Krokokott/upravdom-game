<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;width:640px;height:360px;overflow:hidden;background:#FF001F;color:#fff;font-family:'Onest',Verdana,sans-serif;display:grid;grid-template-columns:1fr 250px;gap:24px;padding:36px 36px 36px 40px}
.l{display:flex;flex-direction:column;justify-content:space-between}
.eb{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
h1{font-size:46px;line-height:1.02;font-weight:600;letter-spacing:-.02em;margin:0}
.sub{font-size:15px;line-height:1.4;opacity:.92}
.card{background:#fff;color:#292522;border-radius:14px;padding:18px;transform:rotate(5deg) translateY(12px);display:flex;flex-direction:column;gap:12px;align-self:center;box-shadow:0 20px 40px -18px rgba(41,37,34,.6)}
.tag{align-self:flex-start;background:#F2F2F2;border-radius:4px;padding:4px 7px;font-size:11px;font-weight:500}
.who{display:flex;gap:10px;align-items:center;font-size:13px;font-weight:500}
.av{width:32px;height:32px;border-radius:50%;background:#292522;color:#fff;display:grid;place-items:center;font-weight:600}
.say{font-size:17px;line-height:1.28;font-weight:500;margin:0}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-top:4px}
.bars i{display:block;height:5px;border-radius:3px;background:#F2F2F2;overflow:hidden}
.bars b{display:block;height:100%;background:#292522}
.bars .w b{background:#FF001F}
</style></head><body>
<div class="l">
  <div class="eb">Мини-игра · 5 минут</div>
  <h1>Управляющий.<br>Первый год</h1>
  <div class="sub">Прибыль, жители, стандарты и стройка. Удержите баланс 12 месяцев.</div>
</div>
<div class="card">
  <span class="tag">Акт приёмки</span>
  <div class="who"><div class="av">П</div>Прораб генподрядчика</div>
  <p class="say">«Принимайте как есть. Пожарку доделаем потом, честное слово»</p>
  <div class="bars"><i><b style="width:62%"></b></i><i class="w"><b style="width:18%"></b></i><i><b style="width:55%"></b></i><i><b style="width:71%"></b></i></div>
</div>
</body></html>
